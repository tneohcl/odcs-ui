[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "odcs-ui"
version = "0.4.7"
description = "Shared design foundation for ODCS App Studio apps: tokens, theming, component states"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tneohcl (ODCS App Studio)" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qt = ["PySide6>=6.8"]

[project.urls]
Repository = "https://github.com/tneohcl/odcs-ui"

[tool.setuptools]
packages = ["odcs_ui"]

[tool.setuptools.package-data]
odcs_ui = ["tokens.json", "base.qss"]
